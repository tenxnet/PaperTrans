[project]
name = "papertrans"
version = "0.1.0"
description = "Local-first academic PDF translation pipeline"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.13.0",
  "jinja2>=3.1.0",
  "pymupdf>=1.26.0",
]

[project.optional-dependencies]
docling = ["docling>=2.0.0"]
test = ["pytest>=8.0.0", "pyyaml>=6.0.0"]

[project.scripts]
papertrans = "papertrans.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/papertrans"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
