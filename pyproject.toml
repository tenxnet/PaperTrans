[project]
name = "papertrans"
version = "0.2.0rc1"
description = "Local-first academic paper translation workspace with an MCP worker"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.13.0",
  "html5lib>=1.1",
  "jinja2>=3.1.0",
  "pymupdf>=1.26.0",
]

[project.optional-dependencies]
mcp = ["mcp>=2.1.1,<3"]
# Compatibility alias for installs made before the MCP worker was generalized.
chatgpt = ["mcp>=2.1.1,<3"]
docling = [
  "docling>=2.123.0,<3",
  "huggingface-hub>=1.0.0,<2",
  "onnxruntime>=1.23.0,<2",
  "psutil>=7.0.0,<8",
]
test = ["mcp>=2.1.1,<3", "pytest>=8.0.0", "pyyaml>=6.0.0"]

[project.scripts]
papertrans = "papertrans.cli:main"
papertrans-mcp = "papertrans.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/papertrans"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
