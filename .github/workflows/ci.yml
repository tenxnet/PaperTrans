name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests and release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Verify the clean exact-SHA checkout
        run: python3 scripts/check_release_checkout.py --commit "$GITHUB_SHA"
      - name: Verify a pushed tag belongs to protected main history
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          python3 scripts/check_release_checkout.py \
            --commit "$GITHUB_SHA" \
            --require-ancestor-of refs/remotes/origin/main
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.11.3"
          python-version: "3.12"
      - run: uv lock --check
      - run: uv sync --frozen --extra test
      - run: uv run --frozen --extra test pytest -q
      - name: Verify the minimum supported Python version
        run: uv run --isolated --python 3.10 --frozen --extra test pytest -q
      - name: Verify the patched Docling dependency boundary
        run: >-
          uv run --frozen --extra test --group docling pytest -q
          tests/test_transformers_security.py
      - name: Audit the complete locked Python application graph
        run: |
          uv export --quiet --frozen --all-extras --all-groups --no-dev --no-emit-project \
            --output-file "$RUNNER_TEMP/papertrans-requirements.txt"
          for python_version in 3.10 3.11 3.12; do
            uvx --python "$python_version" --from pip-audit==2.10.1 pip-audit \
              --requirement "$RUNNER_TEMP/papertrans-requirements.txt" \
              --disable-pip --strict
          done
      - name: Build the Python release artifacts
        run: uv build --out-dir "$RUNNER_TEMP/papertrans-dist"
      - name: Verify the pushed tag matches the release metadata
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PAPERTRANS_RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          uv run --frozen --extra test pytest -q
          tests/test_release_metadata.py::test_release_tag_matches_public_metadata_when_provided
      - name: Verify validation left the checkout clean
        run: python3 scripts/check_release_checkout.py --commit "$GITHUB_SHA"

  web:
    name: Web typecheck and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Verify the clean exact-SHA checkout
        run: python3 scripts/check_release_checkout.py --commit "$GITHUB_SHA"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify validation left the checkout clean
        run: python3 scripts/check_release_checkout.py --commit "$GITHUB_SHA"

  babeldoc-worker:
    name: BabelDOC worker contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Verify the clean exact-SHA checkout
        run: python3 scripts/check_release_checkout.py --commit "$GITHUB_SHA"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.11.3"
          python-version: "3.12"
      - run: uv sync --frozen --extra test
      - name: Test the isolated adapter without installing its evaluation engine
        env:
          PYTHONPATH: workers/babeldoc/worker/src
        run: uv run --frozen --extra test pytest -p no:cacheprovider workers/babeldoc/worker/tests -q
      - name: Compile evaluation helper scripts
        run: >-
          uv run --frozen python -m py_compile
          workers/babeldoc/scripts/fetch_source_artifacts.py
          workers/babeldoc/scripts/generate_runtime_metadata.py
          workers/babeldoc/scripts/generate_tree_manifest.py
          workers/babeldoc/scripts/validate_source.py
          workers/babeldoc/scripts/verify_installed_source_mapping.py
          workers/babeldoc/scripts/verify_tree_manifest.py
          workers/deterministic-gateway/gateway.py
      - name: Validate the BabelDOC container definition
        run: docker buildx build --check workers/babeldoc
      - name: Verify validation left the checkout clean
        run: python3 scripts/check_release_checkout.py --commit "$GITHUB_SHA"

  harumi-worker:
    name: Harumi worker tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Verify the clean exact-SHA checkout
        run: python3 scripts/check_release_checkout.py --commit "$GITHUB_SHA"
      - name: Install the worker's declared Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Validate the Harumi container definition
        run: docker buildx build --check workers/harumi
      - name: Test the locked evaluation worker
        run: cargo +1.88.0 test --locked --manifest-path workers/harumi/Cargo.toml
      - name: Verify validation left the checkout clean
        run: python3 scripts/check_release_checkout.py --commit "$GITHUB_SHA"
