name: Bug report
description: Report a reproducible PaperTrans problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach paper files, generated full-paper translations, credentials, or private local data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: dropdown
    id: path
    attributes:
      label: Processing path
      options:
        - Official arXiv HTML
        - Local web library
        - Codex translation
        - ChatGPT MCP worker (experimental)
        - PDF pipeline (experimental)
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Python, Node.js, and PaperTrans commit or release
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use a public arXiv ID or a minimal synthetic fixture where possible.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove API keys, private paths, personal data, and copyrighted paper content.
      render: shell
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I removed credentials, private data, and non-redistributable paper content.
          required: true
