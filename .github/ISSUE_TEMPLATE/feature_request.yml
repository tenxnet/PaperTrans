name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should PaperTrans solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the behavior rather than only the implementation.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Official arXiv HTML v1 path
        - Reading library and UI
        - Translation quality and terminology
        - ChatGPT MCP worker (experimental)
        - PDF pipeline (post-v1)
        - Other
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Trade-offs
      description: Note expected effects on cost, latency, fidelity, privacy, or compatibility.
