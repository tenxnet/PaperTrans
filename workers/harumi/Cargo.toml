[package]
name = "papertrans-harumi-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[[bin]]
name = "papertrans-harumi-worker"
path = "src/main.rs"

[dependencies]
# Exact pins are deliberate. See README.md before changing either backend.
harumi = { version = "=1.19.0", default-features = false, features = ["draw"] }
harumi-ai = { version = "=0.9.0", default-features = false }

async-trait = "=0.1.89"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
tokio = { version = "=1.52.3", features = ["macros", "rt", "time"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
