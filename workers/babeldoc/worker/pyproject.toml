[project]
name = "papertrans-babeldoc-worker"
version = "0.1.1"
description = "Fail-closed process adapter for the PaperTrans pdf2zh-next/BabelDOC evaluation worker"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = []

[project.scripts]
papertrans-pdf-worker = "papertrans_babeldoc_worker.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/papertrans_babeldoc_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
